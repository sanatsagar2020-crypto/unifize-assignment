<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .service { fill: #e0f2fe; stroke: #0369a1; }
      .data { fill: #ecfdf5; stroke: #047857; }
      .obs { fill: #fef3c7; stroke: #b45309; }
      .edge { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="40" y="54" class="title">Discount Service - Production Architecture</text>
  <text x="40" y="82" class="small">Single AWS region, multi-AZ, synchronous checkout path</text>

  <rect x="35" y="125" width="1180" height="330" class="group"/>
  <text x="55" y="155" class="label">Request Path</text>

  <rect x="70" y="210" width="160" height="78" class="box service"/>
  <text x="102" y="244" class="label">Customer</text>
  <text x="100" y="266" class="small">Browser / App</text>

  <rect x="295" y="210" width="165" height="78" class="box service"/>
  <text x="332" y="244" class="label">Checkout</text>
  <text x="323" y="266" class="small">Pricing request</text>

  <rect x="525" y="210" width="155" height="78" class="box service"/>
  <text x="565" y="244" class="label">ALB</text>
  <text x="548" y="266" class="small">Internal route</text>

  <rect x="745" y="190" width="205" height="118" class="box service"/>
  <text x="785" y="234" class="label">Discount Service</text>
  <text x="795" y="257" class="small">EKS pods + HPA</text>
  <text x="782" y="279" class="small">p99 target under 150 ms</text>

  <rect x="1020" y="155" width="160" height="78" class="box data"/>
  <text x="1063" y="189" class="label">Redis</text>
  <text x="1048" y="211" class="small">Rules + results</text>

  <rect x="1020" y="300" width="160" height="78" class="box data"/>
  <text x="1050" y="334" class="label">PostgreSQL</text>
  <text x="1050" y="356" class="small">Discount rules</text>

  <path d="M230 249 H295" class="edge"/>
  <path d="M460 249 H525" class="edge"/>
  <path d="M680 249 H745" class="edge"/>
  <path d="M950 225 C980 210 990 195 1020 194" class="edge"/>
  <path d="M950 275 C985 295 990 335 1020 339" class="edge"/>

  <rect x="35" y="505" width="1180" height="175" class="group"/>
  <text x="55" y="535" class="label">Observability Path</text>

  <rect x="245" y="575" width="190" height="62" class="box obs"/>
  <text x="283" y="611" class="label">OTel Collector</text>

  <rect x="515" y="535" width="150" height="62" class="box obs"/>
  <text x="551" y="571" class="label">Prometheus</text>

  <rect x="515" y="615" width="150" height="62" class="box obs"/>
  <text x="550" y="651" class="label">Tempo / X-Ray</text>

  <rect x="745" y="575" width="155" height="62" class="box obs"/>
  <text x="787" y="611" class="label">Grafana</text>

  <rect x="970" y="575" width="150" height="62" class="box obs"/>
  <text x="1000" y="611" class="label">PagerDuty</text>

  <path d="M847 308 C760 410 530 545 435 606" class="dash"/>
  <path d="M435 606 H515" class="edge"/>
  <path d="M665 566 H745" class="edge"/>
  <path d="M665 646 C700 646 710 606 745 606" class="edge"/>
  <path d="M900 606 H970" class="edge"/>
</svg>
